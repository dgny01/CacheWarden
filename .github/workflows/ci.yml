name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: |
            victim/go.mod
            aggressor/go.mod
            tools/loadgen/go.mod

      - name: Check formatting
        run: |
          unformatted="$(find victim aggressor tools/loadgen -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following files are not formatted:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Run go vet
        run: make vet

      - name: Run tests
        run: make test

      - name: Build binaries
        run: make build

      - name: Validate Docker Compose configuration
        run: docker compose --profile interference config --quiet
