name: Feature request
description: Propose a focused improvement to CacheWarden.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Please write the proposal in English and keep it within the stated milestone where possible.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the desired behavior without assuming a specific implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds did you evaluate?
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Resource and safety impact
      description: Explain expected CPU, memory, operational, and compatibility effects.
    validations:
      required: true

