name: Bug report
description: Report reproducible incorrect behavior in CacheWarden.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Complete this form in English and remove sensitive data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable sequence of commands.
      placeholder: |
        1. Run ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the OS, CPU architecture, Go version, and Docker Compose version when relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or measurements
      description: Paste concise logs or benchmark summaries without credentials or personal data.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I used bounded resource settings and removed sensitive data.
          required: true

